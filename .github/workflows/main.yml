name: Build and Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Build and lint
        run: python -m py_compile app.py
      - name: Run tests
        run: pytest -q
      - name: Build Docker image
        run: docker build --tag aceest-fitness:${{ github.sha }} .
