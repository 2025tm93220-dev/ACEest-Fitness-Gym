name: CI Pipeline 

on: 

  push: 

  pull_request: 

jobs: 

  build: 

    runs-on: ubuntu-latest 

    steps: 

    - uses: actions/checkout@v4 

    - uses: actions/setup-python@v5 

      with: 

        python-version: "3.11" 

    - name: Install Dependencies 

      run: | 

        pip install -r requirements.txt 

    - name: Run Tests 

      run: | 

        pytest 

    - name: Build Docker Image 

      run: | 

        docker build -t aceest-gym . 
